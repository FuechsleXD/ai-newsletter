# Infrastructure (docs/11-deployment-cicd.md, ADR-011). Never creates app releases.
# - Pull requests with changes below ai-news-digest/infra/: fmt, validate, tflint, shellcheck and,
#   once the bootstrap is done (variable AWS_PLAN_ROLE_ARN), a read-only plan
# - apply only by hand (workflow_dispatch) in the environment "prod" with approval
# Secret values are never part of Terraform; the alarm address comes from the secret ALARM_EMAIL.
name: Infra

on:
  pull_request:
    paths:
      - "ai-news-digest/infra/**"
      - ".github/workflows/infra.yml"
  workflow_dispatch:
    inputs:
      apply:
        description: "terraform apply ausführen (sonst nur plan)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: infra-${{ github.ref }}
  # Never cancel a running apply
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"

jobs:
  check:
    name: Terraform (fmt, validate, tflint) and shellcheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ai-news-digest/infra/terraform
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.17.2"
          terraform_wrapper: false

      - name: Format
        run: terraform fmt -check -recursive -diff

      - name: Validate
        run: |
          terraform init -backend=false -lockfile=readonly
          terraform validate

      - name: Set up tflint
        uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2
        with:
          tflint_version: "v0.66.0"

      - name: tflint
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          tflint --init
          tflint --format compact

      - name: shellcheck (server scripts)
        working-directory: ai-news-digest
        run: shellcheck infra/server/*.sh docker/smoke-test.sh

  plan:
    name: Terraform plan
    needs: check
    # Only after the bootstrap (docs/betrieb/aws-bootstrap.md); before that the job is skipped
    if: vars.AWS_PLAN_ROLE_ARN != '' && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: ai-news-digest/infra/terraform
    env:
      TF_VAR_alarm_email: ${{ secrets.ALARM_EMAIL }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: AWS login (read only)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          aws-region: eu-central-1

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.17.2"
          terraform_wrapper: false

      # The repository is public: the plan goes to the job log only, sensitive values are hidden
      - name: Plan
        run: |
          terraform init -backend-config=backend.hcl -lockfile=readonly
          terraform plan -var-file=prod.tfvars -no-color -lock-timeout=2m

  apply:
    name: Terraform apply
    needs: check
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Manual approval (protection rule of the environment)
    environment: prod
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: ai-news-digest/infra/terraform
    env:
      TF_VAR_alarm_email: ${{ secrets.ALARM_EMAIL }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: AWS login
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_APPLY_ROLE_ARN }}
          aws-region: eu-central-1

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.17.2"
          terraform_wrapper: false

      - name: Plan
        run: |
          terraform init -backend-config=backend.hcl -lockfile=readonly
          terraform plan -var-file=prod.tfvars -no-color -lock-timeout=2m -out=prod.tfplan

      - name: Apply
        if: inputs.apply
        run: terraform apply -no-color -lock-timeout=2m prod.tfplan
