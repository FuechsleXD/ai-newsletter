<!DOCTYPE html>
<!--
  HTML mail (roadmap step 8, simple layout; final style in step 17, docs/09-pdf-design.md):
  one column, table layout, inline CSS, no external images or scripts. All texts come from an LLM
  and are escaped by th:text; only checked source URLs are linked.
-->
<html lang="de" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="${digest.title}">Titel</title>
</head>
<body style="margin:0;padding:0;background:#f3f4f6;font-family:Arial,Helvetica,sans-serif;color:#1f2937;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f3f4f6;">
  <tr>
    <td align="center" style="padding:12px;">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:600px;">
        <tr>
          <td style="background:#1e3a8a;color:#ffffff;padding:14px 16px;border-radius:6px;">
            <div style="font-size:20px;font-weight:bold;" th:text="${digest.title}">Titel</div>
            <div style="font-size:13px;margin-top:4px;"><span th:text="${digest.topicName}">Topic</span> · <span th:text="${digest.period}">Zeitraum</span></div>
            <div style="font-size:13px;margin-top:2px;" th:if="${!#strings.isEmpty(digest.subtitle)}" th:text="${digest.subtitle}">Untertitel</div>
          </td>
        </tr>
        <tr><td style="height:10px;"></td></tr>
        <tr>
          <td style="background:#eff6ff;border:1px solid #93c5fd;border-radius:6px;padding:10px 14px;font-size:14px;">
            <div style="font-weight:bold;margin-bottom:4px;">Kurzfazit</div>
            <div th:text="${digest.summary}">Kurzfazit</div>
          </td>
        </tr>
        <tr><td style="height:10px;"></td></tr>
        <tr>
          <td style="background:#ffffff;border:1px solid #d1d5db;border-radius:6px;padding:10px 14px;font-size:14px;">
            <div style="font-weight:bold;margin-bottom:4px;">Kernpunkte</div>
            <div th:each="point : ${digest.keyPoints}" style="margin:2px 0;">• <span th:text="${point.text}">Kernpunkt</span></div>
          </td>
        </tr>
        <th:block th:each="section : ${digest.sections}">
          <tr><td style="height:10px;"></td></tr>
          <tr>
            <td th:style="${'background:#ffffff;border:2px solid ' + section.colorHex + ';border-radius:6px;padding:10px 14px;font-size:14px;'}">
              <div style="font-weight:bold;font-size:15px;margin-bottom:4px;"><span th:text="${section.number + '. '}">1. </span><span th:text="${section.heading}">Thema</span></div>
              <div th:text="${section.text}">Text</div>
              <div style="margin-top:4px;font-weight:bold;" th:if="${section.highlightValue != null}"><span th:text="${section.highlightValue}">42</span> <span th:text="${section.highlightLabel}">Label</span></div>
              <div style="margin-top:4px;" th:if="${!section.flowSteps.isEmpty()}" th:text="${#strings.listJoin(section.flowSteps, ' → ')}">Ablauf</div>
              <div style="margin-top:6px;font-size:12px;color:#4b5563;">
                Quellen: <span th:each="source, it : ${section.sourceNumbers}" th:text="${'[' + source + ']' + (it.last ? '' : ' ')}">[1]</span>
                · Modelle: <span th:text="${#strings.listJoin(section.models, ', ')}">Modell</span><span style="color:#b45309;" th:if="${section.unconfirmed}"> · unbestätigt</span>
              </div>
            </td>
          </tr>
        </th:block>
        <tr><td style="height:10px;"></td></tr>
        <tr>
          <td style="background:#1e3a8a;color:#ffffff;border-radius:6px;padding:10px 14px;font-size:14px;">
            <div style="font-weight:bold;margin-bottom:4px;">Key Takeaways</div>
            <div th:each="takeaway : ${digest.takeaways}" style="margin:2px 0;">✓ <span th:text="${takeaway}">Takeaway</span></div>
            <th:block th:if="${!#strings.isEmpty(digest.watchOut)}">
              <div style="font-weight:bold;margin:8px 0 4px;">Worauf achten</div>
              <div th:text="${digest.watchOut}">Ausblick</div>
            </th:block>
          </td>
        </tr>
        <tr><td style="height:10px;"></td></tr>
        <tr>
          <td style="font-size:12px;color:#4b5563;padding:0 4px;">
            <div>Erstellt am <span th:text="${digest.createdOn}">Datum</span> · <span th:text="${digest.modelCount}">2</span> Modelle · <span th:text="${digest.sources.size()}">5</span> Quellen · PDF im Anhang</div>
            <div th:each="source : ${digest.sources}" style="margin-top:2px;">[<span th:text="${source.number}">1</span>] <a th:href="${source.url}" style="color:#1e3a8a;" th:text="${source.title}">Quelle</a> (<span th:text="${source.domain}">domain</span>)</div>
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
</body>
</html>
