spring:
  application:
    name: ai-news-digest

  # Fixed texts of the digest per output language (render.DigestLanguage, ADR-017); without a file
  # for the language the English base file is used, never the locale of the server
  messages:
    basename: messages/digest
    encoding: UTF-8
    fallback-to-system-locale: false

  # SMTP: locally Mailpit (docker-compose.yml), in AWS SES with credentials from the environment
  mail:
    host: ${SPRING_MAIL_HOST:localhost}
    port: ${SPRING_MAIL_PORT:1025}
    default-encoding: UTF-8

  # The app connects as a user without DDL rights (docs/06-security.md).
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/newsdigest}
    username: ${DB_APP_USER:newsdigest_app}
    password: ${DB_APP_PASSWORD:}
    hikari:
      data-source-properties:
        # search_path of the app connections; native queries use unqualified names
        currentSchema: app

  # Flyway runs as the schema owner before the app (and later the engine) starts.
  flyway:
    user: ${DB_MIGRATION_USER:newsdigest_migration}
    password: ${DB_MIGRATION_PASSWORD:}
    # History table in "app"; "bpm" holds the CIB seven tables (created by V3, ADR-006)
    schemas: app,bpm
    default-schema: app
    locations:
      - classpath:db/migration/app
      - classpath:db/migration/views
    clean-disabled: true
    out-of-order: false
    validate-on-migrate: true
    placeholders:
      appUser: ${spring.datasource.username}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: app
        jdbc:
          time_zone: UTC

# Embedded CIB seven engine (property prefix is still "camunda.bpm"). Tables are created by Flyway
# from the official scripts (ADR-006); the engine never creates or changes them.
# Process defaults (history TTL, job lock time, retries) come from NewsDigestProperties.
camunda:
  bpm:
    database:
      schema-update: false
      schema-name: bpm
      table-prefix: bpm.
    # No default admin user: identities come from Keycloak (step 25)
    # Deploys src/main/resources/processes/*.bpmn on start (only changed models get a new version)
    auto-deployment-enabled: true
    deployment-resource-pattern: classpath*:processes/*.bpmn
    metrics:
      enabled: false
    # Threads: at least the parallel calls of all providers (max-concurrent-calls-per-provider,
    # one provider so far) plus 2 for the other jobs of the process (docs/12-defaults.md)
    job-execution:
      core-pool-size: 4
      max-pool-size: 10

management:
  endpoints:
    web:
      exposure:
        include: health,info
  health:
    # An SMTP outage must not mark the app as down (the container would be restarted); failed
    # deliveries are retried by the process and end in an incident.
    mail:
      enabled: false

# Defaults are defined in de.fuechsle.ainewsletter.config.NewsDigestProperties (docs/12-defaults.md).
# Override individual values here or via environment variables, e.g. NEWSDIGEST_BUDGET_MONTHLYLIMITUSD=20.
