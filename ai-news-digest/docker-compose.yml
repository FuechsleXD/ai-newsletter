# Local services for development (docs/11-deployment-cicd.md).
# Gotenberg is added in roadmap step 8, Keycloak in step 20.
# Values come from .env (copy .env.example to .env; .env is not checked in).
name: ai-news-digest

services:
  postgres:
    image: postgres:19.0-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-newsdigest}
      # Superuser, only for administration and the init script
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      # Passwords of the users created by docker/postgres/init/01-create-users.sh
      DB_MIGRATION_PASSWORD: ${DB_MIGRATION_PASSWORD:?set DB_MIGRATION_PASSWORD in .env}
      DB_APP_PASSWORD: ${DB_APP_PASSWORD:?set DB_APP_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.34.0
    ports:
      - "127.0.0.1:1025:1025" # SMTP
      - "127.0.0.1:8025:8025" # Web UI: http://localhost:8025

volumes:
  postgres-data:
